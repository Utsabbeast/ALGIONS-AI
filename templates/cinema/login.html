{% extends 'base.html' %}

{% block title %}Sign In — comet{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 flex flex-col items-center">

    <!-- Interactive Animated Login Form (From Uiverse.io by Novaxlo) — Sharp -->
    <form method="POST" class="uiverse-login-form mb-8 shadow-xl" onsubmit="showGlobalLoader('Authenticating with comet...')">
        {% csrf_token %}
        <div id="login-area">
            <p class="title font-casta">COMET ACCESS</p>
        </div>
        
        <div id="email-area">
            <input placeholder="USERNAME" name="username" id="username" class="input font-mono" type="text" required autofocus />
        </div>
        
        <div id="password-area">
            <input placeholder="PASSWORD" name="password" id="password" class="input font-mono" type="password" required />
            <a href="#" class="font-mono text-[10px]">Forgot credentials?</a>
        </div>
        
        <div id="footer-area">
            <button type="submit" class="font-mono">Authorize</button>
            <div id="text-inside" class="font-mono text-xs">
                <p>New to comet?</p>
                <a href="{% url 'cinema:register' %}" id="link">Create Account</a>
            </div>
        </div>

        <div id="background-color"></div>
    </form>

    <!-- Fast Demo Reviewer Logins (Sharp) -->
    <div class="bg-white dark:bg-[#0e0e12] border border-neutral-200 dark:border-neutral-800 p-5 w-full max-w-sm shadow-sm text-center transition-colors">
        <p class="text-[10px] font-mono font-bold uppercase tracking-widest text-neutral-500 mb-3">Reviewer Instant Credentials:</p>
        <div class="grid grid-cols-3 gap-2">
            <a href="{% url 'cinema:demo-login' role='customer' %}" class="py-2 px-1 bg-neutral-50 dark:bg-[#141419] hover:bg-neutral-100 dark:hover:bg-neutral-800 text-xs font-mono uppercase text-neutral-700 dark:text-neutral-300 transition border border-neutral-200 dark:border-neutral-700">
                Customer
            </a>
            <a href="{% url 'cinema:demo-login' role='staff' %}" class="py-2 px-1 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 dark:hover:bg-amber-900/60 border border-amber-300 dark:border-amber-800 text-xs font-mono uppercase text-amber-700 dark:text-amber-300 transition">
                Staff
            </a>
            <a href="{% url 'cinema:demo-login' role='admin' %}" class="py-2 px-1 bg-rose-50 dark:bg-brand-950/40 hover:bg-rose-100 dark:hover:bg-brand-900/60 border border-rose-300 dark:border-brand-800 text-xs font-mono uppercase text-brand-700 dark:text-brand-300 transition">
                Admin
            </a>
        </div>
    </div>

</div>
{% endblock %}
