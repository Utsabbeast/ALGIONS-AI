{% extends 'base.html' %}

{% block title %}Sign In - CinemaBox{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12 flex flex-col items-center">

    <!-- Interactive Animated Login Form (From Uiverse.io by Novaxlo) -->
    <form method="POST" class="uiverse-login-form mb-6 shadow-2xl">
        {% csrf_token %}
        <div id="login-area">
            <p class="title font-casta">LOGIN</p>
        </div>
        
        <div id="email-area">
            <input placeholder="USERNAME" name="username" id="username" class="input" type="text" required autofocus />
        </div>
        
        <div id="password-area">
            <input placeholder="PASSWORD" name="password" id="password" class="input" type="password" required />
            <a href="#">Forgot password?</a>
        </div>
        
        <div id="footer-area">
            <button type="submit">Log In</button>
            <div id="text-inside">
                <p>Don't have an account?</p>
                <a href="{% url 'cinema:register' %}" id="link">Sign Up</a>
            </div>
        </div>

        <div id="background-color"></div>
        <div id="whitefilter"></div>
    </form>

    <!-- Fast Demo Reviewer Logins -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm shadow-xl text-center">
        <p class="text-xs font-semibold text-slate-400 mb-3 font-casta">Fast 1-Click Demo Logins (For Reviewers):</p>
        <div class="grid grid-cols-3 gap-2">
            <a href="{% url 'cinema:demo-login' role='customer' %}" class="text-center py-2 px-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-xl text-slate-200 font-medium transition border border-slate-700">
                Customer
            </a>
            <a href="{% url 'cinema:demo-login' role='staff' %}" class="text-center py-2 px-1 bg-amber-950/60 hover:bg-amber-900/60 border border-amber-800 text-xs rounded-xl text-amber-300 font-medium transition">
                Gate Staff
            </a>
            <a href="{% url 'cinema:demo-login' role='admin' %}" class="text-center py-2 px-1 bg-brand-950/60 hover:bg-brand-900/60 border border-brand-800 text-xs rounded-xl text-brand-300 font-medium transition">
                Admin
            </a>
        </div>
    </div>

</div>
{% endblock %}
