{% extends 'base.html' %}

{% block title %}Create Account - comet{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl transition-colors">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-rose-400 flex items-center justify-center text-white mx-auto mb-3 shadow-lg shadow-brand-500/25">
                <i class="fa-solid fa-user-plus text-lg"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight font-casta">Create an Account</h2>
            <p class="text-slate-500 dark:text-slate-400 text-xs mt-1">Book cinema tickets, earn rewards, and track orders on comet</p>
        </div>

        <form method="POST" class="space-y-4" onsubmit="showGlobalLoader('Creating your comet account...')">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">First Name</label>
                    <input type="text" name="first_name" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-brand-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Last Name</label>
                    <input type="text" name="last_name" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-brand-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-brand-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-brand-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
                <input type="tel" name="phone" placeholder="+91 98765 43210" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-brand-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password (min 6 characters)</label>
                <input type="password" name="password" minlength="6" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-brand-500 transition">
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm py-2.5 rounded-xl shadow-lg shadow-brand-600/30 transition mt-2">
                Create Account
            </button>
        </form>

        <p class="text-xs text-center text-slate-500 dark:text-slate-400 mt-6">
            Already registered? <a href="{% url 'cinema:login' %}" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
