{% extends 'base.html' %}

{% block title %}Create Account — COMET{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white dark:bg-[#0e0e12] border border-neutral-200 dark:border-neutral-800 p-8 shadow-sm transition-colors">
        <div class="text-center mb-8 pb-4 border-b border-neutral-100 dark:border-neutral-800">
            <div class="w-12 h-12 bg-neutral-900 border border-neutral-700 flex items-center justify-center text-white mx-auto mb-3">
                <i class="fa-solid fa-user-plus text-brand-500 text-sm"></i>
            </div>
            <h2 class="text-3xl font-light text-neutral-900 dark:text-white tracking-tight font-casta">Create Account</h2>
            <p class="text-neutral-500 text-xs font-mono mt-1">Reserve seats, access rewards, and manage passes on comet</p>
        </div>

        <form method="POST" class="space-y-4" onsubmit="showGlobalLoader('Creating your comet profile...')">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1">First Name</label>
                    <input type="text" name="first_name" required class="w-full bg-neutral-50 dark:bg-[#141419] border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-xs px-3 py-2.5 focus:outline-none focus:border-brand-500 font-mono transition">
                </div>
                <div>
                    <label class="block text-[10px] font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1">Last Name</label>
                    <input type="text" name="last_name" required class="w-full bg-neutral-50 dark:bg-[#141419] border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-xs px-3 py-2.5 focus:outline-none focus:border-brand-500 font-mono transition">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-neutral-50 dark:bg-[#141419] border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-xs px-3 py-2.5 focus:outline-none focus:border-brand-500 font-mono transition">
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full bg-neutral-50 dark:bg-[#141419] border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-xs px-3 py-2.5 focus:outline-none focus:border-brand-500 font-mono transition">
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1">Phone Number</label>
                <input type="tel" name="phone" placeholder="+91 98765 43210" class="w-full bg-neutral-50 dark:bg-[#141419] border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-xs px-3 py-2.5 focus:outline-none focus:border-brand-500 font-mono transition">
            </div>

            <div>
                <label class="block text-[10px] font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-1">Password</label>
                <input type="password" name="password" minlength="6" required class="w-full bg-neutral-50 dark:bg-[#141419] border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-xs px-3 py-2.5 focus:outline-none focus:border-brand-500 font-mono transition">
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-mono uppercase tracking-widest text-xs font-bold py-3 border border-brand-500 transition mt-4">
                Register Account
            </button>
        </form>

        <p class="text-xs font-mono text-center text-neutral-500 mt-6 pt-4 border-t border-neutral-100 dark:border-neutral-800">
            Already registered? <a href="{% url 'cinema:login' %}" class="text-brand-600 dark:text-brand-400 font-bold hover:underline">Sign in &rarr;</a>
        </p>
    </div>
</div>
{% endblock %}
