services:
  - type: web
    name: cinemabox
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn cinemabox.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Optional: Connect your free MongoDB Atlas cluster for full native NoSQL replication
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_NAME
        value: cinemabox_nosql

